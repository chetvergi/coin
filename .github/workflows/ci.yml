name: FastAPI CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Download repository
              uses: actions/checkout@v7
              with:
                    python-version: '3.12'
                    cache: pip
                    cache-dependency-path:
                        requirements.txt

            - name: Install depencencies
              run:
                    python -m pip install --upgrade pip
                    python -m pip install -r requirements.txt

            - name: Run tests
              run: python -m pytest -v
    package:
        needs: test
        runs-on: ubuntu-latest

        steps:
            - name: Download repository
              uses: actions/checkout@v

            - name: Upload tested application
              uses: actions/checkout@v
              with:
                name: fastapi-service
                path:
                    app.py
                    requirements.txt
                    RADME.md
                retention-days: 7
